<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breakerbook — Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo','Helvetica Neue',sans-serif}
.th-light{--bg:#F1EFEA;--raised:#FBFAF7;--surface:#FFFFFF;--ink:#1A1B1D;--muted:#55595E;--soft:#44474B;--line:#E6E3DC;--line-2:#D6D3CC;--field:#CFCBC2;--dash:#C9C5BC;--warn:#A93F1B;--ok:#3F8A5A;--tag-bg:#E1E8F2;--tag-fg:#27466F;--focus:#2F5FA7;--hdr:#1A1B1D;--hdr-bd:#1A1B1D;--pri:#1A1B1D;--pri-h:#34363A;--pri-fg:#FFFFFF;--amber-soft:#FFF6E8;--amber-ink:#5A3A0C;--hover:#F1EFEA;--btn-bd:#1A1B1D;--btn-bd-h:#1A1B1D;--sel-row:#FFF6E8;--handle:#2A2C2F;--track:#CFCBC2;--fed-bd:#1A1B1D;--ghost:rgba(255,255,255,.85);--room:rgba(255,255,255,.55);--bus-ink:#2F3337;--toggle:#7A7F85;--link-h:#8A4B06;--tie:#8A8F95;--enclosure-bd:#9AA0A6;--breaker-bd:#AEB4BA;--bus:#B3B9BF;--enclosure:#C4C9CE;--enclosure-hi:#E3E6E9;--chip-h:#2E3034;--plan-ink:#2F3337;--on-amber-muted:#3A2A10;--chip-bd:#4A4D52;--room-lit-ink:#6E3F04;--wall:#6E7378;--room-lit-bd:#B8700F;--chip-muted:#C9CACC;--grid-line:#E7E4DD;--grid-bg:#F7F6F2;color-scheme:light}
.th-dark{--bg:#121315;--raised:#1B1D20;--surface:#202226;--ink:#ECEAE4;--muted:#A3A7AD;--soft:#B7BAC0;--line:#2C2F34;--line-2:#34373C;--field:#3C4046;--dash:#44484E;--warn:#F08A64;--ok:#5DBB80;--tag-bg:#1F2E45;--tag-fg:#A9C4EA;--focus:#7FA8E8;--hdr:#0B0C0D;--hdr-bd:#2C2F34;--pri:#F2A33A;--pri-h:#F6B75C;--pri-fg:#121315;--amber-soft:#2A2217;--amber-ink:#F2C27A;--hover:#2A2D31;--btn-bd:#4A4F55;--btn-bd-h:#6E737A;--sel-row:#2A2217;--handle:#0B0C0D;--track:#4A4F55;--fed-bd:#F2A33A;--ghost:rgba(32,34,38,.9);--room:rgba(32,34,38,.72);--bus-ink:#C3C6CB;--toggle:#5E636A;--link-h:#F5B860;--tie:#6E737A;--enclosure-bd:#4A4F55;--breaker-bd:#3A3E43;--bus:#34383D;--enclosure:#25282C;--enclosure-hi:#34383D;--chip-h:#D6D3CC;--plan-ink:#C3C6CB;--on-amber-muted:#3A2A10;--chip-bd:#9A9DA2;--room-lit-ink:#F5B860;--wall:#5E636A;--room-lit-bd:#E0922C;--chip-muted:#4A4D52;--grid-line:#22252A;--grid-bg:#15161A;color-scheme:dark}
a{color:var(--ink)}a:hover{color:var(--amber-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.nav{display:flex;align-items:center;padding:0 14px;color:#B9BBBF;text-decoration:none;font-size:14px;font-weight:600;border-top:3px solid transparent;border-bottom:3px solid transparent}
.nav:hover{color:#FFFFFF}
.nav.is-on{color:#FFFFFF;border-bottom-color:#F2A33A}
.search{width:340px;height:38px;box-sizing:border-box;border:1px solid #3A3C40;border-radius:8px;background:#26282B;color:#ECEAE4;font:inherit;font-size:14px;padding:0 12px 0 36px}
.search::placeholder{color:#9A9DA2}
.search:focus{outline:2px solid #F2A33A;outline-offset:1px}
.tgl{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #3A3C40;border-radius:8px;background:transparent;color:#ECEAE4;cursor:pointer;padding:0;flex-shrink:0}
.tgl:hover{background:#26282B}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 4px;border-radius:3px;background:var(--tag-bg);color:var(--tag-fg);flex-shrink:0;line-height:1.2}
.ov{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;border:1px solid var(--btn-bd);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink);border-color:var(--btn-bd-h)}
.btn-pri{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.btn-pri:hover{background:var(--pri-h);color:var(--pri-fg);border-color:var(--pri-h)}
.btn-warn{color:var(--warn);border-color:var(--warn)}
.btn-warn:hover{color:var(--warn);border-color:var(--warn)}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0;flex-shrink:0}
.ibtn:hover{border-color:var(--btn-bd-h)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .k{font-size:12px;font-weight:600;color:var(--muted)}
.inp{box-sizing:border-box;width:100%;height:44px;padding:0 12px;border:1px solid var(--field);border-radius:6px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
select.inp{padding:0 10px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid #F2A33A;outline-offset:0;border-color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.seg{display:flex;background:var(--line);border-radius:8px;padding:3px;gap:2px}
.sb{height:38px;padding:0 12px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--soft);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sb:hover{color:var(--ink)}
.sb.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.sb .ct{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--muted)}
.chip{height:38px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip.is-on{background:#F2A33A;color:#1A1B1D;border-color:#F2A33A}
.ico{width:30px;height:30px;flex-shrink:0;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bnum{min-width:44px;height:26px;padding:0 5px;box-sizing:border-box;border-radius:4px;background:var(--handle);color:#ECEAE4;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sw{width:48px;height:28px;flex-shrink:0;border:0;border-radius:14px;background:var(--track);padding:3px;cursor:pointer;display:flex;align-items:center;transition:background .15s}
.sw .kn{width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw.is-on{background:#F2A33A}
.sw.is-on .kn{transform:translateX(20px)}
.sw:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.ibtn:focus-visible,.sb:focus-visible,.chip:focus-visible,.sw:focus-visible,.tgl:focus-visible,.th:focus-visible,.rname:focus-visible,.snav:focus-visible,.tcard:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:#F2A33A}
.mini{height:12px;border-radius:2px;background:var(--raised);border:1px solid var(--breaker-bd)}
.mini.a{background:#F2A33A;border-color:#F2A33A}
.busc{height:12px;background:var(--bus);border-radius:1px}
</style>
</helmet>
<div class="{{themeCls}}" style="width: 1440px; height: 960px; display: flex; background: var(--bg); color: var(--ink); overflow: hidden">
<div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center">
<div style="width: 400px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2A33A" stroke-width="2" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"></rect><rect x="9" y="6" width="6" height="7" rx="1" fill="#F2A33A"></rect><path d="M9 17h6"></path></svg>
<span style="font-size: 22px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em">Breakerbook</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.02em">Sign in</h1>
<span style="font-size: 15px; color: var(--soft)">{{home}}</span>
</div>
<sc-if value="{{err}}" hint-placeholder-val="{{false}}"><div role="alert" style="padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--warn); color: var(--warn); font-size: 14px; font-weight: 600">That username and password don’t match.</div></sc-if>
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="fld"><label for="u">Username</label><input id="u" class="inp" type="text" autocomplete="username" value="{{user}}" onChange="{{onUser}}"></div>
<div class="fld"><label for="p">Password</label><input id="p" class="inp" type="password" autocomplete="current-password" value="{{pw}}" onChange="{{onPw}}"></div>
<label class="chk"><input type="checkbox" checked="{{stay}}" onChange="{{toggleStay}}">Stay signed in on this device</label>
<button type="button" class="btn btn-pri" style="height: 50px; font-size: 15px" onClick="{{submit}}">Sign in</button>
</div>
<sc-if value="{{guestOn}}" hint-placeholder-val="{{true}}">
<div style="padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px">
<a class="btn" href="PhonePanel.dc.html">View the panel without signing in</a>
<span style="font-size: 12px; color: var(--muted); text-align: center">Read-only guest view is on for this home.</span>
</div>
</sc-if>
<span style="font-size: 12px; color: var(--muted); line-height: 1.5">Forgot your password? Reset it from the server’s command line — see the docs.</span>
</div>
</div>
<div aria-hidden="true" style="width: 520px; flex-shrink: 0; background: var(--enclosure); border-left: 1px solid var(--enclosure-bd); display: flex; align-items: center; justify-content: center">
<div style="width: 260px; padding: 16px; border-radius: 10px; background: var(--enclosure); border: 1px solid var(--enclosure-bd); box-shadow: 0 20px 50px rgba(0,0,0,.25); display: grid; grid-template-columns: 1fr 12px 1fr; gap: 4px 6px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="60"><span class="{{c.cls}}"></span></sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"guestView":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var set = function (o) { self.setState(o); };
    var dark = this.props.dark !== undefined ? !!this.props.dark : true;
    var guestOn = this.props.guestView !== undefined ? !!this.props.guestView : true;
    var cells = [];
    for (var r = 0; r < 20; r++) {
      cells.push({ key: 'l' + r, cls: 'mini' + (r === 7 ? ' a' : '') });
      cells.push({ key: 'b' + r, cls: 'busc' });
      cells.push({ key: 'r' + r, cls: 'mini' + (r > 14 ? '' : '') });
    }
    return {
      themeCls: dark ? 'th-dark' : 'th-light', home: 'Home',
      user: st.user === undefined ? 'admin' : st.user, pw: st.pw || '',
      onUser: function (e) { set({ user: e.target.value, err: false }); }, onPw: function (e) { set({ pw: e.target.value, err: false }); },
      stay: st.stay === undefined ? true : st.stay, toggleStay: function () { set({ stay: !(st.stay === undefined ? true : st.stay) }); },
      err: !!st.err, submit: function () { set({ err: true }); },
      guestOn: guestOn, cells: cells
    };
  }
}
</script>
</body>
</html>
