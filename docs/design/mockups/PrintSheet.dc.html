<head>
<meta charset="utf-8">
<title>Breakerbook — Printed panel directory</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.prc{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #BDBDBD;min-width:0;box-sizing:border-box}
.prc.r{flex-direction:row-reverse;text-align:right}
.prc.two{border-left:4px solid #111214}
.prc.r.two{border-left:0;border-right:4px solid #111214}
.prc .pn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;min-width:40px;flex-shrink:0}
.prc.r .pn{text-align:right}
.prc .pl{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prc .pm{font-family:'JetBrains Mono',monospace;font-size:12px;color:#2E3034;flex-shrink:0;white-space:nowrap}
.prc.open .pl{color:#767676;font-weight:400}
.prc.write .pl{border-bottom:1px dotted #767676;height:1px;align-self:flex-end;margin-bottom:8px}
.prc.unl .pl{font-style:italic;font-weight:400;color:#4A4D52}
.pt{font-size:26px;font-weight:800;font-stretch:108%;letter-spacing:-0.01em;line-height:1.1}
.sh-l .prc .pn{font-size:19px;min-width:46px}
.sh-l .prc .pl{font-size:18px}
.sh-l .prc .pm{font-size:14px}
.sh-c .prc{gap:6px;padding:0 6px}
.sh-c .prc .pn{font-size:13px;min-width:30px}
.sh-c .prc .pl{font-size:12px}
.sh-c .prc .pm{font-size:12px}
.sh-c .pt{font-size:18px}

</style>
</helmet>
<div class="{{sh.cls}}" style="width: {{sh.w}}px; height: {{sh.h}}px; box-sizing: border-box; padding: {{sh.pad}}px; background: #FFFFFF; color: #111214; display: flex; flex-direction: column; gap: 14px; font-family: 'Archivo', 'Helvetica Neue', sans-serif">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 12px; border-bottom: 2px solid #111214">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #4A4D52">PANEL DIRECTORY</span>
<span class="pt">{{sh.title}}</span>
<span style="font-size: 12px; color: #4A4D52">{{sh.sub}}</span>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start; flex-shrink: 0">
<sc-if value="{{sh.showDate}}" hint-placeholder-val="{{true}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A4D52; text-align: right; line-height: 1.4">Printed<br>{{sh.date}}</span></sc-if>
<sc-if value="{{sh.showQr}}" hint-placeholder-val="{{true}}"><span style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="width: {{sh.qr}}px; height: {{sh.qr}}px; box-sizing: border-box; border: 1.5px dashed #4A4D52; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #4A4D52">QR</span><span style="font-size: 12px; color: #4A4D52">Live map</span></span></sc-if>
</div>
</div>
<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr); grid-template-rows: repeat({{sh.rows}}, minmax(0, 1fr)); border: 1.5px solid #111214">
<sc-for list="{{sh.cells}}" as="c" hint-placeholder-count="30">
<div class="{{c.cls}}" style="grid-row: {{c.row}} / span {{c.span}}; grid-column: {{c.col}}"><span class="pn">{{c.num}}</span><span class="pl">{{c.label}}</span><sc-if value="{{c.hasMeta}}" hint-placeholder-val="{{true}}"><span class="pm">{{c.meta}}</span></sc-if></div>
</sc-for>
<sc-for list="{{sh.gut}}" as="g" hint-placeholder-count="20"><div style="grid-row: {{g.row}}; grid-column: 2; background: #EDEDED; border-bottom: 1px solid #BDBDBD"></div></sc-for>
</div>
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: #2E3034; line-height: 1.4">
<span>{{sh.legend}}</span>
<span style="font-weight: 700; text-align: right">Test before you touch. Labels can be wrong.</span>
</div>
</div>
