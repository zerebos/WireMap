<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breakerbook — Panel (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo','Helvetica Neue',sans-serif}
.th-light{--bg:#F1EFEA;--raised:#FBFAF7;--surface:#FFFFFF;--ink:#1A1B1D;--muted:#55595E;--soft:#44474B;--line:#E6E3DC;--line-2:#D6D3CC;--field:#CFCBC2;--dash:#C9C5BC;--warn:#A93F1B;--ok:#3F8A5A;--tag-bg:#E1E8F2;--tag-fg:#27466F;--focus:#2F5FA7;--hdr:#1A1B1D;--hdr-bd:#1A1B1D;--pri:#1A1B1D;--pri-h:#34363A;--pri-fg:#FFFFFF;--amber-soft:#FFF6E8;--amber-ink:#5A3A0C;--hover:#F1EFEA;--btn-bd:#1A1B1D;--btn-bd-h:#1A1B1D;--sel-row:#FFF6E8;--handle:#2A2C2F;--track:#CFCBC2;--fed-bd:#1A1B1D;--ghost:rgba(255,255,255,.85);--room:rgba(255,255,255,.55);--bus-ink:#2F3337;--toggle:#7A7F85;--link-h:#8A4B06;--tie:#8A8F95;--enclosure-bd:#9AA0A6;--breaker-bd:#AEB4BA;--bus:#B3B9BF;--enclosure:#C4C9CE;--enclosure-hi:#E3E6E9;--chip-h:#2E3034;--plan-ink:#2F3337;--on-amber-muted:#3A2A10;--chip-bd:#4A4D52;--room-lit-ink:#6E3F04;--wall:#6E7378;--room-lit-bd:#B8700F;--chip-muted:#C9CACC;--grid-line:#E7E4DD;--grid-bg:#F7F6F2;color-scheme:light}
.th-dark{--bg:#121315;--raised:#1B1D20;--surface:#202226;--ink:#ECEAE4;--muted:#A3A7AD;--soft:#B7BAC0;--line:#2C2F34;--line-2:#34373C;--field:#3C4046;--dash:#44484E;--warn:#F08A64;--ok:#5DBB80;--tag-bg:#1F2E45;--tag-fg:#A9C4EA;--focus:#7FA8E8;--hdr:#0B0C0D;--hdr-bd:#2C2F34;--pri:#F2A33A;--pri-h:#F6B75C;--pri-fg:#121315;--amber-soft:#2A2217;--amber-ink:#F2C27A;--hover:#2A2D31;--btn-bd:#4A4F55;--btn-bd-h:#6E737A;--sel-row:#2A2217;--handle:#0B0C0D;--track:#4A4F55;--fed-bd:#F2A33A;--ghost:rgba(32,34,38,.9);--room:rgba(32,34,38,.72);--bus-ink:#C3C6CB;--toggle:#5E636A;--link-h:#F5B860;--tie:#6E737A;--enclosure-bd:#4A4F55;--breaker-bd:#3A3E43;--bus:#34383D;--enclosure:#25282C;--enclosure-hi:#34383D;--chip-h:#D6D3CC;--plan-ink:#C3C6CB;--on-amber-muted:#3A2A10;--chip-bd:#9A9DA2;--room-lit-ink:#F5B860;--wall:#5E636A;--room-lit-bd:#E0922C;--chip-muted:#4A4D52;--grid-line:#22252A;--grid-bg:#15161A;color-scheme:dark}
a{color:var(--ink)}a:hover{color:var(--amber-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.nav{display:flex;align-items:center;padding:0 14px;color:#B9BBBF;text-decoration:none;font-size:14px;font-weight:600;border-top:3px solid transparent;border-bottom:3px solid transparent}
.nav:hover{color:#FFFFFF}
.nav.is-on{color:#FFFFFF;border-bottom-color:#F2A33A}
.search{width:340px;height:38px;box-sizing:border-box;border:1px solid #3A3C40;border-radius:8px;background:#26282B;color:#ECEAE4;font:inherit;font-size:14px;padding:0 12px 0 36px}
.search::placeholder{color:#9A9DA2}
.search:focus{outline:2px solid #F2A33A;outline-offset:1px}
.tgl{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #3A3C40;border-radius:8px;background:transparent;color:#ECEAE4;cursor:pointer;padding:0;flex-shrink:0}
.tgl:hover{background:#26282B}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 4px;border-radius:3px;background:var(--tag-bg);color:var(--tag-fg);flex-shrink:0;line-height:1.2}
.ov{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;border:1px solid var(--btn-bd);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink);border-color:var(--btn-bd-h)}
.btn-pri{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.btn-pri:hover{background:var(--pri-h);color:var(--pri-fg);border-color:var(--pri-h)}
.btn-warn{color:var(--warn);border-color:var(--warn)}
.btn-warn:hover{color:var(--warn);border-color:var(--warn)}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0;flex-shrink:0}
.ibtn:hover{border-color:var(--btn-bd-h)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .k{font-size:12px;font-weight:600;color:var(--muted)}
.inp{box-sizing:border-box;width:100%;height:44px;padding:0 12px;border:1px solid var(--field);border-radius:6px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
select.inp{padding:0 10px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid #F2A33A;outline-offset:0;border-color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.seg{display:flex;background:var(--line);border-radius:8px;padding:3px;gap:2px}
.sb{height:38px;padding:0 12px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--soft);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sb:hover{color:var(--ink)}
.sb.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.sb .ct{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--muted)}
.chip{height:38px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip.is-on{background:#F2A33A;color:#1A1B1D;border-color:#F2A33A}
.ico{width:30px;height:30px;flex-shrink:0;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bnum{min-width:44px;height:26px;padding:0 5px;box-sizing:border-box;border-radius:4px;background:var(--handle);color:#ECEAE4;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sw{width:48px;height:28px;flex-shrink:0;border:0;border-radius:14px;background:var(--track);padding:3px;cursor:pointer;display:flex;align-items:center;transition:background .15s}
.sw .kn{width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw.is-on{background:#F2A33A}
.sw.is-on .kn{transform:translateX(20px)}
.sw:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.ibtn:focus-visible,.sb:focus-visible,.chip:focus-visible,.sw:focus-visible,.tgl:focus-visible,.th:focus-visible,.rname:focus-visible,.snav:focus-visible,.tcard:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.tab:hover{color:var(--ink)}
.tab.is-on{color:var(--ink)}
.tab.is-on svg{color:#F2A33A}
.tab:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}

.pb{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1px;width:100%;box-sizing:border-box;padding:4px 14px 4px 8px;border:1px solid var(--breaker-bd);border-radius:4px;background:var(--raised);font:inherit;color:var(--ink);text-align:left;cursor:pointer;overflow:hidden}
.pb.r{padding:4px 8px 4px 14px;text-align:right}
.pb::after{content:'';position:absolute;top:6px;bottom:6px;right:3px;width:5px;border-radius:2px;background:var(--handle)}
.pb.r::after{right:auto;left:3px}
.pb-1{height:46px}.pb-2{height:94px}
.pb .n{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pb.r .n{justify-content:flex-end}
.pb .l{font-size:13px;font-weight:600;font-stretch:78%;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb.is-unl .l{color:var(--warn);font-style:italic}
.pb.is-sel{background:#F2A33A;color:#1A1B1D;border-color:#1A1B1D}
.pb.is-sel .n{color:#1A1B1D}
.pb.is-dim{opacity:.3}
.pb-open{border-style:dashed;background:transparent;cursor:default}
.pb-open::after{display:none}
.pb:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tg{font-size:9px;font-weight:700;padding:1px 3px;border-radius:2px;background:var(--tag-bg);color:var(--tag-fg)}
</style>
</helmet>
<div class="{{themeCls}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); overflow: hidden; position: relative">
<header style="flex-shrink: 0; height: 56px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 10px; background: var(--hdr); color: #ECEAE4; border-bottom: 1px solid var(--hdr-bd)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2A33A" stroke-width="2" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"></rect><rect x="9" y="6" width="6" height="7" rx="1" fill="#F2A33A"></rect><path d="M9 17h6"></path></svg>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 16px; font-weight: 800; font-stretch: 108%">{{title}}</span><span class="mono" style="font-size: 11px; color: #B9BBBF">{{sub}}</span></div>
<div style="flex-grow: 1"></div>
<sc-if value="{{guest}}" hint-placeholder-val="{{false}}"><span class="mono" style="font-size: 11px; font-weight: 600; color: #F2A33A; border: 1px solid #F2A33A; border-radius: 10px; padding: 2px 8px">READ-ONLY</span><a class="btn" href="SignIn.dc.html" style="height: 36px; padding: 0 10px; background: transparent; color: #ECEAE4; border-color: #3A3C40">Sign in</a></sc-if>
<sc-if value="{{notGuest}}" hint-placeholder-val="{{true}}"><a class="tgl" href="Settings.dc.html" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a></sc-if>
</header>
<div style="padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--raised)">
<label for="pq" class="sr">Search breakers and items</label>
<input id="pq" class="inp" type="search" style="height: 42px" placeholder="Search breakers, items, rooms" value="{{q}}" onChange="{{onSearch}}">
</div>
<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 12px">
<div style="background: var(--enclosure); border: 1px solid var(--enclosure-bd); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px">
<div style="align-self: center; display: flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--enclosure-bd); border-radius: 5px; padding: 4px 10px 4px 4px"><span style="width: 34px; height: 24px; border-radius: 3px; background: var(--handle)"></span><span class="mono" style="font-size: 12px; font-weight: 600">MAIN 200A</span></div>
<div style="display: flex; gap: 6px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px"><sc-for list="{{left}}" as="b" hint-placeholder-count="20"><sc-if value="{{b.open}}" hint-placeholder-val="{{false}}"><div class="{{b.cls}}"><span class="n">{{b.num}}</span><span class="l" style="color: var(--muted); font-style: italic; font-weight: 500">Open</span></div></sc-if><sc-if value="{{b.isB}}" hint-placeholder-val="{{true}}"><button type="button" class="{{b.cls}}" onClick="{{b.pick}}" aria-label="{{b.aria}}"><span class="n">{{b.num}} · {{b.amps}}<sc-if value="{{b.hasTag}}" hint-placeholder-val="{{false}}"><span class="tg">{{b.tag}}</span></sc-if></span><span class="l">{{b.label}}</span></button></sc-if></sc-for></div>
<div aria-hidden="true" style="width: 16px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; background: var(--bus); border-radius: 3px"><sc-for list="{{legs}}" as="g" hint-placeholder-count="20"><div class="mono" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--bus-ink); writing-mode: vertical-rl">{{g.n}}</div></sc-for></div>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px"><sc-for list="{{right}}" as="b" hint-placeholder-count="20"><sc-if value="{{b.open}}" hint-placeholder-val="{{false}}"><div class="{{b.cls}}"><span class="n">{{b.num}}</span><span class="l" style="color: var(--muted); font-style: italic; font-weight: 500">Open</span></div></sc-if><sc-if value="{{b.isB}}" hint-placeholder-val="{{true}}"><button type="button" class="{{b.cls}}" onClick="{{b.pick}}" aria-label="{{b.aria}}"><span class="n">{{b.num}} · {{b.amps}}<sc-if value="{{b.hasTag}}" hint-placeholder-val="{{false}}"><span class="tg">{{b.tag}}</span></sc-if></span><span class="l">{{b.label}}</span></button></sc-if></sc-for></div>
</div>
</div>
</div>
<nav aria-label="Primary" style="flex-shrink: 0; height: 64px; display: flex; border-top: 1px solid var(--line-2); background: var(--raised)"><a class="{{tabPanel}}" href="PhonePanel.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M12 3v18M8 8h1M15 8h1M8 12h1M15 12h1M8 16h1M15 16h1"></path></svg>Panel</a><a class="{{tabMap}}" href="PhoneMap.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a><a class="{{tabItems}}" href="Items.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Items</a><sc-if value="{{notGuest}}" hint-placeholder-val="{{true}}"><a class="{{tabTrace}}" href="TracePick.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"></path></svg>Trace</a></sc-if></nav>

<sc-if value="{{hasSheet}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim, rgba(0,0,0,.55)); z-index: 10"></div>
<div role="dialog" aria-modal="true" aria-labelledby="sh-t" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; z-index: 11; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.3)">
<div style="padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line)">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line-2)"></div>
<div style="display: flex; align-items: flex-start; gap: 12px">
<span class="bnum" style="height: 40px; min-width: 52px; font-size: 15px; background: #F2A33A; color: #1A1B1D">{{s.num}}</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span class="ov">{{s.slot}}</span><h2 id="sh-t" style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 105%; line-height: 1.15">{{s.name}}</h2><span style="font-size: 13px; color: var(--muted)">{{s.spec}}</span></div>
<button type="button" class="ibtn" aria-label="Close" onClick="{{close}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: {{s.cols}}; gap: 8px">
<a class="btn" href="PhoneMap.dc.html" style="padding: 0 8px">Show on map</a>
<a class="btn" href="Shutoff.dc.html" style="padding: 0 8px">Shut off</a>
<sc-if value="{{canEdit}}" hint-placeholder-val="{{true}}"><button type="button" class="btn" style="padding: 0 8px">Edit</button></sc-if>
</div>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 4px">
<span class="ov" style="padding: 4px 0 6px">{{s.powers}}</span>
<sc-for list="{{s.items}}" as="i" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line)"><span class="ico"><sc-if value="{{i.io}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="3"></rect><path d="M9.5 8.5v3M14.5 8.5v3"></path><circle cx="12" cy="16" r="1.1"></circle></svg></sc-if><sc-if value="{{i.il}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"></path></svg></sc-if><sc-if value="{{i.is}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><rect x="10" y="7" width="4" height="6" rx="1"></rect></svg></sc-if><sc-if value="{{i.ia}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><circle cx="12" cy="13.5" r="4"></circle><path d="M7.5 6.5h2"></path></svg></sc-if></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.n}}</span><span style="font-size: 12px; color: var(--muted)">{{i.where}}</span></span></div>
</sc-for>
<sc-if value="{{s.none}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; color: var(--muted); padding: 8px 0">Nothing mapped yet. Trace it to find out.</span></sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"guest":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
var FLOORS = { bsmt: 'Basement', main: 'Main floor', up: 'Upstairs' };
var TYPES = { std: 'Standard', gfci: 'GFCI', afci: 'AFCI', df: 'Dual function' };
var TAG = { std: '', gfci: 'GF', afci: 'AF', df: 'DF' };
var TL = { outlet: 'Outlet', light: 'Light', 'switch': 'Switch', appliance: 'Appliance' };
var BREAKERS = [
